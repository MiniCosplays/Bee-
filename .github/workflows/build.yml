name: Build Bee Totem

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Bee Totem project
        run: |
          unzip -q "bee_totem_26_3_shoulder_ready (1).zip"

      - name: Fix Minecraft 26.3 Gradle configuration
        working-directory: "bee_totem_26_3_shoulder_ready"
        run: |
          cat > settings.gradle <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  maven { url = uri("https://maven.fabricmc.net/") }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }

          dependencyResolutionManagement {
              // Fabric Loom adds its own project repository.
              repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

              repositories {
                  maven { url = uri("https://maven.fabricmc.net/") }
                  mavenCentral()
              }
          }

          rootProject.name = 'bee_totem_26_3_thirdperson'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom' version '1.17.21'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              maven { url = uri("https://maven.fabricmc.net/") }
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings loom.officialMojangMappings()

              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property 'version', project.version

              filesMatching('fabric.mod.json') {
                  expand version: project.version
              }
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(25)
              }

              withSourcesJar()
          }

          tasks.withType(JavaCompile).configureEach {
              options.release = 25
          }

          tasks.jar {
              from('LICENSE') {
                  rename { "${it}_${project.archives_base_name}" }
              }
          }
          EOF

      - name: Build mod
        working-directory: "bee_totem_26_3_shoulder_ready"
        run: |
          gradle clean build \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace \
            --info

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bee-totem-jar
          path: "bee_totem_26_3_shoulder_ready/build/libs/*.jar"
