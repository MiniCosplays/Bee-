name: Build Bee Totem

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Bee Totem project
        run: |
          unzip -q "bee_totem_26_3_shoulder_ready (1).zip"

      - name: Build mod
        working-directory: "bee_totem_26_3_shoulder_ready"
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bee-totem-jar
          path: "bee_totem_26_3_shoulder_ready/build/libs/*.jar"
