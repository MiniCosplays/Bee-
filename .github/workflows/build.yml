name: Build Bee Totem

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Bee Totem project
        run: |
          unzip -q "bee_totem_26_3_shoulder_ready (1).zip"

      - name: Fix Minecraft 26.3 build configuration
        working-directory: "bee_totem_26_3_shoulder_ready"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          text = path.read_text()

          text = text.replace(
              "id 'fabric-loom' version '1.17.21'",
              "id 'net.fabricmc.fabric-loom' version '1.17.21'"
          )

          text = text.replace(
              "    mappings loom.officialMojangMappings()\n",
              ""
          )

          text = text.replace(
              '    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"',
              '    implementation "net.fabricmc:fabric-loader:${project.loader_version}"'
          )

          text = text.replace(
              '    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"',
              '    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"'
          )

          path.write_text(text)
          PY

      - name: Build mod
        working-directory: "bee_totem_26_3_shoulder_ready"
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: bee-totem-jar
          path: "bee_totem_26_3_shoulder_ready/build/libs/*.jar"
